[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-risk-replication"
version = "0.1.0"
description = "Reproduction of AI-news stock risk premium and volatility forecasts (Salisu & Badmus, 2026)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
  "scipy>=1.12,<2",
  "statsmodels>=0.14,<0.16",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
